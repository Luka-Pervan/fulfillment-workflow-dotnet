services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  telemetry:
    image: otel/opentelemetry-collector-contrib:0.130.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./ops/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  migrations:
    build:
      context: .
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: Postgres
      Database__MigrateOnStartup: "false"
      ConnectionStrings__Fulfillment: >-
        Host=database;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Authentication__Issuer: fulfillment-local
      Authentication__Audience: fulfillment-api
      Authentication__SigningKey: ${AUTH_SIGNING_KEY:?Copy .env.example to .env}
    depends_on:
      database:
        condition: service_healthy

  api:
    build:
      context: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Database__Provider: Postgres
      Database__MigrateOnStartup: "false"
      ConnectionStrings__Fulfillment: >-
        Host=database;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Authentication__Issuer: fulfillment-local
      Authentication__Audience: fulfillment-api
      Authentication__SigningKey: ${AUTH_SIGNING_KEY:?Copy .env.example to .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      database:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      telemetry:
        condition: service_started
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
